const DYNAMICS_DEFAULT_MIX={add:0.425,delete:0.425,swap:0.15};
function lawDynamicsOf(c,d){
  const dyn=((c||{}).spec||{}).dynamics||{}, given=(d||{}).law_dynamics||{};
  const raw=given.move_mix||dyn.move_mix;
  const mix=Object.assign({swap:0},(raw&&Object.keys(raw).length)?raw:DYNAMICS_DEFAULT_MIX);
  const zero=given.zero_temperature!=null?!!given.zero_temperature:(!!dyn.zero_temperature||(c||{}).regime==='zero_temperature');
  return {zero, beta:given.beta!=null?given.beta:dyn.beta,
    locality:+(given.locality!=null?given.locality:(dyn.locality||0))||0, localityWritten:dyn.locality!=null,
    localMove:given.local_move||dyn.local_move||'toggle', mix,
    sweeps:given.sweeps!=null?given.sweeps:dyn.sweeps, cooling:given.cooling||dyn.cooling||null,
    init:given.init||((c||{}).spec||{}).init};
}
function lawDynamicsBlock(c,d){
  const x=lawDynamicsOf(c,d), pc=v=>`${(100*v).toFixed(1)}%`, num=v=>(v==null||!isFinite(+v))?'\u2013':String(+(+v).toPrecision(6));
  const rows=[];
  rows.push(['temperature', x.zero
    ?`zero: a move is taken only if it does not raise the energy`+(x.beta!=null?`; the beta drawn with the law, ${num(x.beta)}, is not used`:'')
    :`beta ${num(x.beta)}`+(+x.beta>0?`, a temperature of ${num(1/x.beta)}`:'')+': a move that raises the energy by \u0394 is taken with probability e^(\u2212beta \u0394)']);
  if(x.cooling) rows.push(['cooling',`from beta ${num(x.cooling.from_beta)} to the law\u2019s beta over ${x.cooling.over_sweeps} sweeps`]);
  rows.push(['locality', x.locality>0
    ?`${num(x.locality)}: ${pc(x.locality)} of the moves are local, a ${x.localMove} of the edge between two neighbours of a node; the other ${pc(1-x.locality)} are global, between any two nodes`
    :`0${x.localityWritten?'':', the default'}: every move is global, between any two nodes`]);
  const m=x.mix, tot=(+m.add||0)+(+m.delete||0)+(+m.swap||0)||1;
  rows.push(['global moves',`add ${pc((+m.add||0)/tot)} \u00b7 delete ${pc((+m.delete||0)/tot)} \u00b7 swap ${pc((+m.swap||0)/tot)}`]);
  rows.push(['sweeps', x.sweeps!=null?`${x.sweeps} a chain as drawn; the certificate may run a rung\u2019s chains longer, up to its multiplier`:'\u2013']);
  return el('table',{class:'law-dynamics',title:'how this law moves: every setting of its dynamics, the defaults written out; the same in the repro JSON under law_dynamics'},

      const low=keys.filter(k=>{ const side=sideOf(chains,r.n,k); return side&&side.giant_fraction&&side.giant_fraction.mean!=null&&connFloor!=null&&+side.giant_fraction.mean<connFloor; });
      rt.append(el('tr',{class:'rung-row'},el('td',{},'N='+String(r.n)),el('td',{},statusCell(r.n,true)),el('td',{},String(s.seeds)),
        el('td',{title:'distinct simulation jobs / all attempts including retries; interrupted attempts were stopped by a pause or a restart, not by the law'},
          `${cpt.jobs||0} / ${cpt.attempts||0}`+((+cpt.interrupted_attempts||0)?` (${cpt.interrupted_attempts} interrupted)`:'')),
        el('td',{title:`successful ${fmtDur(cpt.successful_seconds)} · failed/retried ${fmtDur(cpt.failed_seconds)}`+((+cpt.interrupted_seconds||0)?` · interrupted by a pause or restart ${fmtDur(cpt.interrupted_seconds)}`:'')},fmtDur(cpt.core_seconds)),
        el('td',{},fmtDur(cpt.cumulative_core_seconds)),
        el('td',{},screen===null?el('span',{class:'muted',title:screenTitle(eq)},'n/a'):el('span',{class:'badge '+(screen?'bg-ok':'bg-bad'),title:screenTitle(eq)},screen?'passed':'failed')),
        el('td',{},el('span',{class:'state '+(evidence==='decision-eligible'?'stabilizing':evidence==='provisional'?'inconclusive':'undetermined'),title:EVIDENCE_HELP[evidence]||''},evidence)),
        el('td',low.length?{class:'below-floor'}:{},low.length?low.map(k=>k==='empty'?'empty':String(TC_SHORT[k]||k)).join(', '):'—'))); });
    const columnCount=9;
    [...workByN.keys()].filter(n=>!measuredNs.has(n)).sort((a,b)=>a-b).forEach(n=>{
      const cells=[el('td',{},'N='+String(n)),el('td',{},statusCell(n,false))];
      while(cells.length<columnCount) cells.push(el('td',{class:'muted'},'—'));
      rt.append(el('tr',{class:'rung-inflight'},...cells)); });
    rungHost.append(rt,el('p',{class:'muted rung-read'},'what every chain read at each size is in the table under the chains’ plots above'));
    relabelSoon(); };
  renderRungs(null);
  if(workByN.size) app.append(el('p',{class:'muted'},
    'rows marked running/queued are being gathered now; a rung with no measured row yet is a data '
    +'point the fleet is currently trying to collect'));
  const readingHost=el('div',{class:'structure-reading'},el('p',{class:'muted'},'reading every chain’s graph…'));
  app.append(readingHost);
  const structureUrl='/structure-data/'+encodeURIComponent(String(d.campaign_id||c.campaign_id||currentCampaign||''))+'/'+encodeURIComponent(c.candidate_id);
  const readStructure=tries=>j(structureUrl).catch(e=>{ if(tries>0&&e&&e.retryable)
    return new Promise(r=>setTimeout(r,Number(e.retry_after_ms)||2000)).then(()=>readStructure(tries-1)); throw e; });
  readStructure(1)
    .then(payload=>{ twoChainsHost.textContent=''; renderTwoChains(twoChainsHost,payload,structureUrl.replace('/structure-data/','/curves-data/'),relabel);
      flowHost.textContent=''; renderFlowEveryStart(flowHost,payload);
      scoreHost.textContent=''; renderLawScore(scoreHost,payload); fillScoreChip(scoreChip,payload&&payload.score); fillTypeChip(typeChip,payload&&payload.phenotype,c); fillOrigin(originHost,payload);
      renderRungs(payload&&payload.chains||null);
      readingHost.innerHTML=''; renderEveryChainGraph(readingHost,payload,d.rungs||[]); renderWhatHappened(readingHost,payload); relabel(); })
    .catch(e=>{ twoChainsHost.textContent=''; twoChainsHost.append(el('h2',{'data-tone':'cyan'},'the chains'),el('p',{class:'muted'},'the chains are unavailable: '+(e&&e.message)));
      flowHost.textContent=''; flowHost.append(el('h2',{'data-tone':'blue'},'finite-size flow, every start'),el('p',{class:'muted'},'unavailable: '+(e&&e.message)));
      scoreHost.textContent=''; scoreHost.append(el('h2',{'data-tone':'blue'},'the score'),el('p',{class:'muted'},'the score is unavailable: '+(e&&e.message)));
      fillScoreChip(scoreChip,null);
      readingHost.innerHTML=''; renderEveryChainGraph(readingHost,null,d.rungs||[]); readingHost.append(el('p',{class:'muted'},'every chain’s reading is unavailable: '+(e&&e.message))); relabel(); });
  const lin=d.lineage;
  if(lin&&(lin.rungs||[]).length){
    app.append(el('h2',{'data-tone':'teal'},'base block, from campaign '+String(lin.source_campaign_id)));
    app.append(el('p',{class:'muted'},
      `the same law (${lin.source_ensemble_code||'\u2014'}) measured up to the anchor `
      +`N=${lin.anchor_n} in its source campaign \u00b7 ${lin.score_scope}`));
    const lt=el('table',{},el('tr',{},...['N','seeds','d_s','d_V','d_B','d_w','mean degree','connected']
      .map(h=>el('th',{},h))));
    (lin.rungs||[]).slice().sort((a,b)=>a.n-b.n).forEach(r=>{
      const s=r.summary||{}, byChannel={};
      (r.channels||[]).forEach(c=>{byChannel[c.channel]=c;});
      const seeds=s.seeds??s.measurement_seeds??'\u2014';
      lt.append(el('tr',{class:'rung-lineage'},
        el('td',{},'N='+String(r.n)), el('td',{},String(seeds)),
        ...['d_s','d_V','d_B','d_w'].map(ch=>el('td',{},channelValue(byChannel[ch]||{},seeds))),
        el('td',{},stat(s.mean_degree)), el('td',{},stat(s.connected_fraction))));});
    app.append(lt);
  }
  root.append(flowSection, thermSection, contextSection);
  app=root;
  app.append(el('h2',{'data-tone':'violet'},'engine decision trail'));
  const decisions=d.engine_decisions||[];
  if(decisions.length){
    const dt=el('table',{},el('tr',{},...['when','N','action','rule','reason','priority','jobs created'].map(h=>el('th',{},h))));
    decisions.forEach(x=>dt.append(el('tr',{},
      el('td',{class:'muted'},fmtMoment(x.created_utc)),
      el('td',{},x.at_n==null?'-':String(x.at_n)),
      el('td',{},x.action+(x.released_hold?' (hold released)':'')),
      el('td',{},x.rule),
      el('td',{},x.reason),
      el('td',{},x.priority==null?'-':String(x.priority)),
      el('td',{},String(x.jobs_created)))));
    app.append(dt);
  } else app.append(el('p',{class:'muted'},'no engine decision yet'));
  relabel();
}

(async()=>{ try{
  if(qs.get('candidate')) await candidateView(qs.get('candidate'));
  else { location.replace(HOME); return; }
}catch(e){ document.getElementById('app').textContent='error: '+e.message; }})();
